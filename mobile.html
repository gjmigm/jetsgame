<!doctype html> <html lang="en"> <head> <meta charset="utf-8" /> <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> <meta name="apple-mobile-web-app-capable" content="yes" /> <title>Jets Game — Mobile</title> <style> :root { --safe-bottom: env(safe-area-inset-bottom); --safe-top: env(safe-area-inset-top); } html,body { height:100%; margin:0; background:#000; -webkit-user-select:none; user-select:none; touch-action:none; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); color:#fff; font-family: system-ui, -apple-system, "Helvetica Neue", Arial; } #frame { position:fixed; left:0; right:0; top:0; bottom:0; border:0; width:100%; height:100%; } /* Minimal overlay container retained for future features, currently hidden */ #controls { display:none; } </style> </head> <body> <!-- The game is loaded inside a same-origin iframe so the wrapper can add mobile UI without changing desktop index.html --> <iframe id="frame" src="index.html" allow="autoplay; fullscreen"></iframe> <div id="controls" aria-hidden="true"></div> <script> // Mobile wrapper: keep scale/viewport messages and wrapper-ready handshake. const frame = document.getElementById('frame'); function postMessageToFrame(type, payload) { if (!frame.contentWindow) return; frame.contentWindow.postMessage({ source: 'mobile-wrapper', type, payload }, '*'); } function sendScale() { const dpr = Math.max(1, window.devicePixelRatio || 1); postMessageToFrame('scale', { dpr }); } window.addEventListener('resize', () => { sendScale(); postMessageToFrame('viewport-resize', { w: innerWidth, h: innerHeight, dpr: window.devicePixelRatio || 1 }); }); // Inform the frame that we are ready frame.addEventListener('load', () => { sendScale(); postMessageToFrame('wrapper-ready', { ua: navigator.userAgent }); }); // Keep scale up-to-date when devicePixelRatio changes let lastDPR = window.devicePixelRatio || 1; setInterval(() => { const dpr = window.devicePixelRatio || 1; if (dpr !== lastDPR) { lastDPR = dpr; sendScale(); } }, 1000); </script> </body> </html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#041E42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Jets Jersey Challenge</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #e0f7fa;
      text-align: center;
      padding: clamp(16px, 5vw, 50px);
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      color: #0077c0;
      font-size: clamp(22px, 6vw, 36px);
    }
    #player-number {
      font-size: clamp(36px, 12vw, 72px);
      margin: 20px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    input {
      padding: 12px;
      font-size: clamp(16px, 4vw, 18px);
      width: min(300px, 90%);
      border: 2px solid #0077c0;
      border-radius: 6px;
    }
    button {
      padding: 12px 20px;
      font-size: clamp(15px, 4vw, 18px);
      width: min(300px, 90%);
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: #0077c0;
      color: white;
    }
    button:active {
      opacity: 0.85;
    }
    #next-button {
      background-color: #004d40;
    }
    #result {
      margin-top: 20px;
      font-size: clamp(18px, 5vw, 24px);
    }
    #progress {
      margin-top: 20px;
      font-size: clamp(16px, 4vw, 20px);
      color: #004d40;
    }
    #hint {
      margin-top: 10px;
      font-size: clamp(16px, 4vw, 20px);
      color: #00695c;
    }
    #correct-list {
      margin-top: 10px;
      font-size: clamp(15px, 4vw, 18px);
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Jets Jersey Challenge</h1>
  <p>Guess the player's full name for jersey number:</p>
  <div id="player-number">--</div>
  <div class="controls">
    <input type="text" id="player-name" placeholder="Enter full name" autocomplete="off">
    <button id="submit-button">Submit</button>
    <button id="hint-button">Show Hint</button>
    <div id="hint"></div>
    <div id="result"></div>
    <button id="next-button" style="display:none;">Next Player</button>
  </div>
  <div id="progress"></div>
  <div id="correct-list"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const players = {
        1: "Eric Comrie",
        2: "Dylan DeMelo",
        4: "Neal Pionk",
        5: "Luke Schenn",
        6: "Colin Miller",
        7: "Vladislav Namestnikov",
        9: "Alex Iafallo",
        13: "Gabriel Vilardi",
        14: "Gustav Nyquist",
        17: "Adam Lowry",
        19: "Jonathan Toews",
        24: "Haydn Fleury",
        28: "Jaret Anderson-Dolan",
        36: "Morgan Barron",
        37: "Connor Hellebuyck",
        41: "David Gustafsson",
        44: "Josh Morrissey",
        54: "Dylan Samberg",
        55: "Mark Scheifele",
        62: "Nino Niederreiter",
        64: "Logan Stanley",
        70: "Tanner Pearson",
        81: "Kyle Connor",
        91: "Cole Perfetti"
      };

      let currentNumber;
      let correctGuesses = new Set();

      function getRandomPlayer() {
        const remainingNumbers = Object.keys(players).filter(num => !correctGuesses.has(num));
        if (remainingNumbers.length === 0) {
          document.getElementById("player-number").textContent = "🎉";
          document.getElementById("result").textContent = "You've guessed all players!";
          document.getElementById("next-button").style.display = "none";
          document.getElementById("hint").textContent = "";
          updateProgress();
          return;
        }

        currentNumber = remainingNumbers[Math.floor(Math.random() * remainingNumbers.length)];
        document.getElementById("player-number").textContent = currentNumber;
        document.getElementById("result").textContent = "";
        document.getElementById("player-name").value = "";
        document.getElementById("next-button").style.display = "none";
        document.getElementById("hint").textContent = "";
        updateProgress();
      }

      function checkAnswer() {
        const input = document.getElementById("player-name").value.trim().toLowerCase();
        const correct = players[currentNumber].toLowerCase();
        const result = document.getElementById("result");

        if (input === correct) {
          result.textContent = "✅ Correct!";
          result.style.color = "green";
          correctGuesses.add(currentNumber);
        } else {
          result.textContent = `❌ Incorrect. It was ${players[currentNumber]}.`;
          result.style.color = "red";
        }

        document.getElementById("next-button").style.display = "inline-block";
        updateProgress();
      }

      function showHint() {
        const name = players[currentNumber];
        const initials = name.split(" ").map(part => part[0]).join(". ") + ".";
        document.getElementById("hint").textContent = `Hint: ${initials}`;
      }

      function updateProgress() {
        const total = Object.keys(players).length;
        const correct = correctGuesses.size;
        document.getElementById("progress").textContent = `Progress: ${correct} out of ${total} correct`;

        const list = Array.from(correctGuesses)
          .sort((a, b) => Number(a) - Number(b))
          .map(num => `#${num}: ${players[num]}`)
          .join("<br>");

        document.getElementById("correct-list").innerHTML = `<strong>Correct Answers:</strong><br>${list}`;
      }

      // Hook up buttons
      document.getElementById("submit-button").addEventListener("click", checkAnswer);
      document.getElementById("hint-button").addEventListener("click", showHint);
      document.getElementById("next-button").addEventListener("click", getRandomPlayer);

      // Allow Enter key to submit
      document.getElementById("player-name").addEventListener("keydown", e => {
        if (e.key === "Enter") checkAnswer();
      });

      // Start the game
      getRandomPlayer();
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
